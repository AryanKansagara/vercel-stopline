name: StopLine tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Build static frontend artifact
        run: node scripts/build-frontend.mjs
      - run: node cli.mjs compare --repeats 1
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker build -t stopline-ci .
      - run: docker run -d --name stopline-ci --tmpfs /data/stopline:rw,noexec,nosuid,uid=1000,gid=1000,mode=0700 -p 127.0.0.1:3000:3000 stopline-ci
      - run: node scripts/http-smoke.mjs
      - run: node scripts/product-smoke.mjs
      - name: Container health and non-root identity
        run: |
          test "$(docker exec stopline-ci id -u)" != "0"
          docker exec stopline-ci node -e "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1))"
      - name: Root-owned volume initialization and privilege drop
        run: |
          docker run -d --name stopline-volume --user 0 --tmpfs /data:rw,noexec,nosuid,mode=0700 -e DROP_PRIVILEGES=1 -e DATA_DIR=/data/stopline -p 127.0.0.1:3001:3000 stopline-ci
          BASE_URL=http://127.0.0.1:3001 node scripts/product-smoke.mjs
          docker exec --user 1000 stopline-volume node -e "const s=require('node:fs').readFileSync('/proc/1/status','utf8');if(!/^Uid:\s+1000\s+1000\s+1000\s+1000$/m.test(s))process.exit(1)"
      - name: Stop container
        if: always()
        run: |
          docker logs stopline-ci || true
          docker stop --time 5 stopline-ci || true
          docker logs stopline-volume || true
          docker stop --time 5 stopline-volume || true
